name: Hey City staging deploy (manual, isolated)
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Reviewed 40-character Git commit SHA (must equal staging approval variable)'
        required: true
        type: string
      artifact_run_id:
        description: 'Successful validation run containing the reviewed artifact (never rebuild here)'
        required: true
        type: string
permissions:
  actions: read
  contents: read
  checks: read
concurrency:
  group: heycity-staging-deploy
  cancel-in-progress: false
jobs:
  staging:
    if: github.ref == 'refs/heads/main' && github.repository == 'gris812/Hey-City'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    steps:
      - name: Verify manually reviewed revision
        id: approved
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          APPROVED_SHA: ${{ vars.STAGING_APPROVED_SHA }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a full lowercase Git SHA' >&2; exit 1; }
          [[ "$APPROVED_SHA" == "$REQUESTED_SHA" ]] || { echo 'Requested revision is not approved in staging environment' >&2; exit 1; }
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout approved revision
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.approved.outputs.sha }}
          persist-credentials: false

      - name: Confirm exact source revision and passing CI
        shell: bash
        env:
          SHA: ${{ steps.approved.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SHA" ]]
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "validate" and .conclusion == "success")] | length' \
            | grep -qxE '[1-9][0-9]*'

      - name: Checkout reviewed release tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ vars.RELEASE_TOOLING_SHA }}
          path: release-tools
          persist-credentials: false

      - name: Validate artifact provenance and successful run
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.artifact_run_id }}
          SHA: ${{ steps.approved.outputs.sha }}
          CONFIG_DIGEST: ${{ vars.STAGING_APPROVED_CONFIG_DIGEST }}
          TOOLING_SHA: ${{ vars.RELEASE_TOOLING_SHA }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_RUN" =~ ^[0-9]+$ ]]
          [[ "$TOOLING_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CONFIG_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN" > "$RUNNER_TEMP/run.json"
          python3 - "$RUNNER_TEMP/run.json" "$SHA" <<'PYCODE'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['head_sha']==sys.argv[2] and r['conclusion']=='success'
          assert r['path']=='.github/workflows/validation.yml' and r['event']=='pull_request'
          assert r['head_repository']['full_name']=='gris812/Hey-City'
          PYCODE
          gh run download "$ARTIFACT_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "staging-api-$SHA" --dir "$RUNNER_TEMP/reviewed-image"
          cd "$RUNNER_TEMP/reviewed-image"
          python3 - "$SHA" <<'PYCODE'
          import hashlib,json,re,sys
          from pathlib import Path
          line=Path('SHA256SUMS').read_text().strip()
          assert re.fullmatch('[a-f0-9]{64}  api.tar.gz',line)
          h=hashlib.sha256()
          with open('api.tar.gz','rb') as f:
              while b:=f.read(1048576): h.update(b)
          assert h.hexdigest()==line.split()[0]
          assert json.load(open('provenance.json'))['sourceSha']==sys.argv[1]
          PYCODE
          python3 "$GITHUB_WORKSPACE/release-tools/ops/image_identity.py" api.tar.gz \
            --sha "$SHA" --config-digest "$CONFIG_DIGEST" > "$RUNNER_TEMP/verified-identity.json"
          python3 - "$RUNNER_TEMP/verified-identity.json" <<'PYCODE'
          import json,sys
          proof=json.load(open(sys.argv[1])); p=json.load(open('provenance.json'))
          assert p['os']=='linux' and p['architecture']=='amd64'
          assert p['imageId'] in {proof['configDigest'],*(x['digest'] for x in proof['descriptors'])}, 'CI engine ID has no verified config/manifest/index correspondence'
          PYCODE
          gzip -dc api.tar.gz > "$RUNNER_TEMP/heycity-staging-image.tar"

      - name: Transfer image via restricted staging SSH identity
        shell: bash
        env:
          SHA: ${{ steps.approved.outputs.sha }}
          DEPLOY_HOST: ${{ secrets.STAGING_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing staging host secret}"
          : "${DEPLOY_USER:?Missing staging user secret}"
          : "${DEPLOY_KEY:?Missing staging private key}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing verified staging known_hosts}"
          [[ "$DEPLOY_USER" == 'heycity-staging-ci' ]] || exit 1
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || exit 1
          umask 077
          install -d -m 700 "$RUNNER_TEMP/staging-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/staging-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/staging-ssh/known_hosts"
          ssh -T -i "$RUNNER_TEMP/staging-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/staging-ssh/known_hosts" \
            -o ConnectTimeout=12 -o ConnectionAttempts=1 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $SHA" \
            < "$RUNNER_TEMP/heycity-staging-image.tar"

      - name: Public staging and unchanged production HTTPS smoke tests
        env:
          SHA: ${{ steps.approved.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 3 --max-time 12 \
            https://staging-api.heycity.stolbergco.com/health | \
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["environment"]=="staging" and d["buildSha"]==sys.argv[1]' "$SHA"
          curl -fsS --max-time 12 \
            https://api.heycity.stolbergco.com/health >/dev/null
          echo 'staging_https=ok production_https=ok'
