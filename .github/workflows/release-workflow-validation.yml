name: Validate release workflows
on:
  pull_request:
    paths:
      - '.github/workflows/staging-deploy.yml'
      - '.github/workflows/ios-staging-build.yml'
      - '.github/workflows/release-workflow-validation.yml'
permissions:
  contents: read
jobs:
  release-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Validate release workflow schema, expressions and shell
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/staging-deploy.yml .github/workflows/ios-staging-build.yml .github/workflows/release-workflow-validation.yml
